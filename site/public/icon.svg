<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb01f"/>
      <stop offset="0.55" stop-color="#f7861b"/>
      <stop offset="1" stop-color="#ff4d2e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <!-- globe: bold dark meridians, high contrast on the warm gradient -->
  <g fill="none" stroke="#1a0f06" stroke-width="17" opacity="0.9">
    <circle cx="256" cy="262" r="140"/>
    <ellipse cx="256" cy="262" rx="56" ry="140"/>
    <line x1="116" y1="262" x2="396" y2="262"/>
  </g>
  <!-- flight arc sweeping across, with a plane head and origin dot -->
  <path d="M126 348 Q250 96 402 196" fill="none" stroke="#1a0f06" stroke-width="30" stroke-linecap="round"/>
  <circle cx="126" cy="348" r="26" fill="#1a0f06"/>
  <path d="M402 196 l-44 -8 18 40 12 -16 z" fill="#fff4d6" stroke="#1a0f06" stroke-width="8" stroke-linejoin="round"/>
  <circle cx="402" cy="196" r="13" fill="#fff4d6"/>
</svg>
